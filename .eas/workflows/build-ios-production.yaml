name: Build iOS Production

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS App
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      platform: ios
      build_id: ${{ needs.build_ios.outputs.build_id }}
